<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="-apple-system, 'Helvetica Neue', sans-serif">
  <style>
    .title  { font-size: 16px; font-weight: 600; fill: #111; }
    .label  { font-size: 12px; fill: #333; }
    .small  { font-size: 11px; fill: #777; }
    .mono   { font-family: 'SF Mono', 'Menlo', 'Courier New', monospace; font-size: 13px; }
    .monoB  { font-family: 'SF Mono', 'Menlo', 'Courier New', monospace; font-size: 13px; font-weight: 600; }
    .head   { font-size: 12px; font-weight: 600; fill: #222; }
    .pref   { fill: #d4e6f7; stroke: #4a7fb5; }
    .suff   { fill: #f4f4f4; stroke: #666; }
    .bucket { fill: #fff8d5; stroke: #c9a227; stroke-width: 1.2; }
    .bEmpty { fill: #f6f6f6; stroke: #bbb; stroke-width: 1; stroke-dasharray: 3 3; }
    .dOne   { fill: #d5f0d2; stroke: #4d7c47; }
    .dZero  { fill: #fafafa; stroke: #888; }
    .qHi    { fill: #ffe1b8; stroke: #cc7a00; stroke-width: 1.5; }
    .axis   { stroke: #444; stroke-width: 1; fill: none; }
  </style>

  <!-- TITLE -->
  <text x="480" y="22" text-anchor="middle" class="title">
    ERE — Elias-Fano encoding of the sorted key set
  </text>
  <text x="480" y="38" text-anchor="middle" class="small">
    n = 8, K = 8, prefix 3 bits, suffix w = 5 bits, B = 8
  </text>

  <!-- ============ ROW 1: SORTED KEYS ============ -->
  <text x="20" y="64" class="head">keys</text>

  <!-- 8 keys at x_left = 80 + i*100, width = 88, height = 24, y = 50..74 -->
  <!-- key cell: prefix 32 wide + suffix 56 wide -->
  <g>
    <!-- Key 0: 000|01010 (=10) -->
    <rect class="pref" x="80"  y="50" width="32" height="24"/>
    <text x="96"  y="67" text-anchor="middle" class="monoB">000</text>
    <rect class="suff" x="112" y="50" width="56" height="24"/>
    <text x="140" y="67" text-anchor="middle" class="mono">01010</text>
    <!-- Key 1: 001|00011 (=35) -->
    <rect class="pref" x="180" y="50" width="32" height="24"/>
    <text x="196" y="67" text-anchor="middle" class="monoB">001</text>
    <rect class="suff" x="212" y="50" width="56" height="24"/>
    <text x="240" y="67" text-anchor="middle" class="mono">00011</text>
    <!-- Key 2: 010|00111 (=71) -->
    <rect class="pref" x="280" y="50" width="32" height="24"/>
    <text x="296" y="67" text-anchor="middle" class="monoB">010</text>
    <rect class="suff" x="312" y="50" width="56" height="24"/>
    <text x="340" y="67" text-anchor="middle" class="mono">00111</text>
    <!-- Key 3: 010|11010 (=90) -->
    <rect class="pref" x="380" y="50" width="32" height="24"/>
    <text x="396" y="67" text-anchor="middle" class="monoB">010</text>
    <rect class="suff" x="412" y="50" width="56" height="24"/>
    <text x="440" y="67" text-anchor="middle" class="mono">11010</text>
    <!-- Key 4: 011|01000 (=104) -->
    <rect class="pref" x="480" y="50" width="32" height="24"/>
    <text x="496" y="67" text-anchor="middle" class="monoB">011</text>
    <rect class="suff" x="512" y="50" width="56" height="24"/>
    <text x="540" y="67" text-anchor="middle" class="mono">01000</text>
    <!-- Key 5: 101|10000 (=176) -->
    <rect class="pref" x="580" y="50" width="32" height="24"/>
    <text x="596" y="67" text-anchor="middle" class="monoB">101</text>
    <rect class="suff" x="612" y="50" width="56" height="24"/>
    <text x="640" y="67" text-anchor="middle" class="mono">10000</text>
    <!-- Key 6: 111|00101 (=229) -->
    <rect class="pref" x="680" y="50" width="32" height="24"/>
    <text x="696" y="67" text-anchor="middle" class="monoB">111</text>
    <rect class="suff" x="712" y="50" width="56" height="24"/>
    <text x="740" y="67" text-anchor="middle" class="mono">00101</text>
    <!-- Key 7: 111|11010 (=250) -->
    <rect class="pref" x="780" y="50" width="32" height="24"/>
    <text x="796" y="67" text-anchor="middle" class="monoB">111</text>
    <rect class="suff" x="812" y="50" width="56" height="24"/>
    <text x="840" y="67" text-anchor="middle" class="mono">11010</text>
  </g>

  <!-- arrow ↓ -->
  <text x="480" y="98" text-anchor="middle" class="small">↓ split by 3-bit prefix</text>

  <!-- ============ ROW 2: A — RIBBON WITH BUCKET LABELS ABOVE EACH SECTION (= EF lower bits) ============ -->
  <text x="20" y="148" class="head">A</text>
  <text x="20" y="162" class="small">lower bits</text>
  <text x="20" y="174" class="small">(packed)</text>

  <g>
    <!-- ribbon body -->
    <rect class="bucket" x="80" y="140" width="780" height="36" rx="3"/>

    <!-- B000 section: 1 cell -->
    <text x="122" y="132" text-anchor="middle" class="head">Bucket 000</text>
    <rect class="suff" x="92"  y="148" width="60" height="20"/>
    <text x="122" y="163" text-anchor="middle" class="mono">01010</text>
    <line x1="166" y1="142" x2="166" y2="174" stroke="#888" stroke-width="1.5"/>

    <!-- B001 section: 1 cell -->
    <text x="210" y="132" text-anchor="middle" class="head">Bucket 001</text>
    <rect class="suff" x="180" y="148" width="60" height="20"/>
    <text x="210" y="163" text-anchor="middle" class="mono">00011</text>
    <line x1="254" y1="142" x2="254" y2="174" stroke="#888" stroke-width="1.5"/>

    <!-- B010 section: 2 cells (orange highlight) -->
    <rect class="qHi" x="262" y="142" width="138" height="32" rx="2"/>
    <text x="331" y="132" text-anchor="middle" class="head" fill="#cc7a00">Bucket 010</text>
    <rect class="suff" x="270" y="148" width="60" height="20"/>
    <text x="300" y="163" text-anchor="middle" class="mono">00111</text>
    <rect class="suff" x="334" y="148" width="60" height="20"/>
    <text x="364" y="163" text-anchor="middle" class="mono">11010</text>
    <line x1="412" y1="142" x2="412" y2="174" stroke="#888" stroke-width="1.5"/>

    <!-- B011 section: 1 cell -->
    <text x="450" y="132" text-anchor="middle" class="head">Bucket 011</text>
    <rect class="suff" x="420" y="148" width="60" height="20"/>
    <text x="450" y="163" text-anchor="middle" class="mono">01000</text>
    <line x1="494" y1="142" x2="494" y2="174" stroke="#888" stroke-width="1.5"/>

    <!-- ... -->
    <text x="600" y="132" text-anchor="middle" class="head" fill="#888">⋯</text>
    <text x="600" y="168" text-anchor="middle" class="title" fill="#888">···</text>
    <line x1="700" y1="142" x2="700" y2="174" stroke="#888" stroke-width="1.5"/>

    <!-- B111 section: 2 cells -->
    <text x="780" y="132" text-anchor="middle" class="head">Bucket 111</text>
    <rect class="suff" x="710" y="148" width="60" height="20"/>
    <text x="740" y="163" text-anchor="middle" class="mono">00101</text>
    <rect class="suff" x="780" y="148" width="60" height="20"/>
    <text x="810" y="163" text-anchor="middle" class="mono">11010</text>
  </g>

  <!-- A bit-size annotation (right of ribbon) -->
  <text x="870" y="156" font-size="13" font-style="italic" font-weight="600" fill="#2d5b8a">K − ⌊log n⌋</text>
  <text x="870" y="172" font-size="11" font-weight="500" fill="#2d5b8a">bits / key</text>

  <!-- Tick arrows from D 1's up to ribbon section starts -->
  <g stroke="#999" stroke-width="0.8" fill="none" stroke-dasharray="2 2">
    <line x1="92"  y1="235" x2="92"  y2="176"/>
    <line x1="128" y1="235" x2="180" y2="176"/>
    <line x1="176" y1="235" x2="262" y2="176"/>
    <line x1="248" y1="235" x2="420" y2="176"/>
    <line x1="350" y1="235" x2="710" y2="176"/>
  </g>

  <!-- ============ ROW 3: METADATA D ============ -->
  <text x="20" y="244" class="head">D</text>
  <text x="20" y="258" class="small">upper bits</text>
  <text x="20" y="270" class="small">(unary)</text>

  <!-- D = 10 | 10 | 100 | 10 | ... | 100 | 1
       Visible cells: 2+2+3+2 + "..." + 3+1 = 13 + gap
       Each cell 24×24, start at x=80 -->
  <g transform="translate(80, 235)">
    <!-- B0: 10 -->
    <rect class="dOne"  x="0"   y="0" width="24" height="24"/><text x="12"  y="17" text-anchor="middle" class="monoB">1</text>
    <rect class="dZero" x="24"  y="0" width="24" height="24"/><text x="36"  y="17" text-anchor="middle" class="mono">0</text>
    <!-- B1: 10 -->
    <rect class="dOne"  x="48"  y="0" width="24" height="24"/><text x="60"  y="17" text-anchor="middle" class="monoB">1</text>
    <rect class="dZero" x="72"  y="0" width="24" height="24"/><text x="84"  y="17" text-anchor="middle" class="mono">0</text>
    <!-- B2: 100 -->
    <rect class="dOne"  x="96"  y="0" width="24" height="24"/><text x="108" y="17" text-anchor="middle" class="monoB">1</text>
    <rect class="dZero" x="120" y="0" width="24" height="24"/><text x="132" y="17" text-anchor="middle" class="mono">0</text>
    <rect class="dZero" x="144" y="0" width="24" height="24"/><text x="156" y="17" text-anchor="middle" class="mono">0</text>
    <!-- B3: 10 -->
    <rect class="dOne"  x="168" y="0" width="24" height="24"/><text x="180" y="17" text-anchor="middle" class="monoB">1</text>
    <rect class="dZero" x="192" y="0" width="24" height="24"/><text x="204" y="17" text-anchor="middle" class="mono">0</text>
    <!-- ... gap -->
    <text x="240" y="17" text-anchor="middle" class="title" fill="#888">···</text>
    <!-- B7: 100 -->
    <rect class="dOne"  x="270" y="0" width="24" height="24"/><text x="282" y="17" text-anchor="middle" class="monoB">1</text>
    <rect class="dZero" x="294" y="0" width="24" height="24"/><text x="306" y="17" text-anchor="middle" class="mono">0</text>
    <rect class="dZero" x="318" y="0" width="24" height="24"/><text x="330" y="17" text-anchor="middle" class="mono">0</text>
    <!-- sentinel -->
    <rect class="dOne"  x="342" y="0" width="24" height="24"/><text x="354" y="17" text-anchor="middle" class="monoB">1</text>

    <!-- block-group brackets -->
    <path class="axis" d="M 0,28 v 4 h 48 v -4"/>
    <text x="24"  y="46" text-anchor="middle" class="small">B0</text>
    <path class="axis" d="M 48,28 v 4 h 48 v -4"/>
    <text x="72"  y="46" text-anchor="middle" class="small">B1</text>
    <path class="axis" d="M 96,28 v 4 h 72 v -4"/>
    <text x="132" y="46" text-anchor="middle" class="small">B2</text>
    <path class="axis" d="M 168,28 v 4 h 48 v -4"/>
    <text x="192" y="46" text-anchor="middle" class="small">B3</text>
    <path class="axis" d="M 270,28 v 4 h 72 v -4"/>
    <text x="306" y="46" text-anchor="middle" class="small">B7</text>
    <text x="354" y="46" text-anchor="middle" class="small">end</text>
  </g>

  <!-- D bit-size annotation (right of D vector) -->
  <text x="500" y="250" font-size="13" font-style="italic" font-weight="600" fill="#2d5b8a">2n + 1</text>
  <text x="500" y="265" font-size="11" font-weight="500" fill="#2d5b8a">bits</text>

  <!-- ============ ROW 4: QUERY ============ -->
  <line x1="20" y1="320" x2="940" y2="320" stroke="#ddd" stroke-width="1"/>

  <text x="20" y="350" class="head">Query</text>

  <g transform="translate(80, 350)">
    <!-- a = 010 | 00100 -->
    <rect class="pref" x="0"  y="-15" width="32" height="22"/>
    <text x="16" y="1" text-anchor="middle" class="monoB">010</text>
    <rect class="qHi"  x="32" y="-15" width="56" height="22"/>
    <text x="60" y="1" text-anchor="middle" class="mono">00100</text>
    <text x="100" y="0" class="label">..</text>
    <!-- b = 010 | 11111 -->
    <rect class="pref" x="116" y="-15" width="32" height="22"/>
    <text x="132" y="1" text-anchor="middle" class="monoB">010</text>
    <rect class="qHi"  x="148" y="-15" width="56" height="22"/>
    <text x="176" y="1" text-anchor="middle" class="mono">11111</text>

    <text x="220" y="0" class="label">→</text>
    <text x="240" y="0" class="label">Bucket 010</text>
    <text x="320" y="0" class="label">→</text>
    <text x="340" y="0" class="mono">scan {7, 26}:  26 ∈ [4..31]</text>

    <text x="560" y="0" class="monoB" fill="#2d7a2d">→ NON-EMPTY ✓</text>
  </g>

</svg>
