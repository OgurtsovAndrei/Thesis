<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="sans-serif" font-size="13">

  <!-- ============================================================ -->
  <!-- TITLE                                                        -->
  <!-- ============================================================ -->
  <text x="380" y="22" text-anchor="middle" font-size="15" font-weight="bold">Phantom points and false-positive query ranges (for a single stored key x)</text>

  <!-- ============================================================ -->
  <!-- SHARED: U' AXIS (projected universe, sits above both halves) -->
  <!-- x' = h(x) = hash image of the stored key                    -->
  <!-- ============================================================ -->
  <text x="20" y="53" font-weight="bold" font-size="13">U' (projected universe)</text>
  <line x1="60" y1="72" x2="700" y2="72" stroke="#333" stroke-width="2"/>
  <!-- x' point -->
  <circle cx="370" cy="72" r="6" fill="#ff9800" stroke="#e65100" stroke-width="1.5"/>
  <text x="370" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">x'</text>
  <!-- caption -->
  <text x="455" y="67" font-size="12" fill="#888">h(y) = x' for all phantoms y</text>

  <!-- ============================================================ -->
  <!-- SECTION 1: RANDOM HASH                                       -->
  <!-- Phantoms scattered uniformly; each gets its own L-strip      -->
  <!-- ============================================================ -->

  <!-- section header -->
  <text x="20" y="103" font-weight="bold" font-size="14">Random hash — phantoms in U</text>
  <text x="20" y="119" font-size="12" fill="#555">Points y ∈ Y mapped to x' are scattered across U</text>

  <!-- U axis -->
  <line x1="60" y1="158" x2="700" y2="158" stroke="#333" stroke-width="1.5"/>
  <text x="50" y="162" text-anchor="end" font-size="12" fill="#666">U</text>

  <!-- collision strips: one green L-width rect centered on each phantom -->
  <!-- strip 1 — phantom at cx=130 -->
  <rect x="95"  y="142" width="70" height="32" fill="#4caf50" opacity="0.22" rx="2" stroke="#4caf50" stroke-width="0.8" stroke-dasharray="3,2"/>
  <!-- strip 2 — phantom at cx=245 -->
  <rect x="210" y="142" width="70" height="32" fill="#4caf50" opacity="0.22" rx="2" stroke="#4caf50" stroke-width="0.8" stroke-dasharray="3,2"/>
  <!-- strip 3 — phantom at cx=355 -->
  <rect x="320" y="142" width="70" height="32" fill="#4caf50" opacity="0.22" rx="2" stroke="#4caf50" stroke-width="0.8" stroke-dasharray="3,2"/>
  <!-- strip 4 — phantom at cx=495 -->
  <rect x="460" y="142" width="70" height="32" fill="#4caf50" opacity="0.22" rx="2" stroke="#4caf50" stroke-width="0.8" stroke-dasharray="3,2"/>
  <!-- strip 5 — phantom at cx=615 -->
  <rect x="580" y="142" width="70" height="32" fill="#4caf50" opacity="0.22" rx="2" stroke="#4caf50" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- L size labels (one per strip) -->
  <text x="130" y="191" text-anchor="middle" font-size="12" fill="#388e3c">L</text>
  <text x="245" y="191" text-anchor="middle" font-size="12" fill="#388e3c">L</text>
  <text x="355" y="191" text-anchor="middle" font-size="12" fill="#388e3c">L</text>
  <text x="495" y="191" text-anchor="middle" font-size="12" fill="#388e3c">L</text>
  <text x="615" y="191" text-anchor="middle" font-size="12" fill="#388e3c">L</text>

  <!-- phantom points (red) -->
  <circle cx="130" cy="158" r="5" fill="#d32f2f"/>
  <circle cx="245" cy="158" r="5" fill="#d32f2f"/>
  <circle cx="355" cy="158" r="5" fill="#d32f2f"/>
  <circle cx="495" cy="158" r="5" fill="#d32f2f"/>
  <circle cx="615" cy="158" r="5" fill="#d32f2f"/>

  <!-- stored key x (blue, larger) — sits between strip 3 and strip 4, no collision strip -->
  <circle cx="425" cy="158" r="7" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="425" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">x</text>

  <!-- arrows: each phantom maps up to x' in U' -->
  <line x1="130" y1="142" x2="368" y2="79" stroke="#d32f2f" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="245" y1="142" x2="369" y2="79" stroke="#d32f2f" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="355" y1="142" x2="370" y2="79" stroke="#d32f2f" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="495" y1="142" x2="371" y2="79" stroke="#d32f2f" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="615" y1="142" x2="372" y2="79" stroke="#d32f2f" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/>
  <!-- x also maps to x' -->
  <line x1="425" y1="151" x2="373" y2="79" stroke="#1565c0" stroke-width="1.1" stroke-dasharray="3,3" opacity="0.7"/>

  <!-- collision zone label -->
  <text x="375" y="210" text-anchor="middle" font-size="13" fill="#388e3c">Collision zone ≈ L × (2&#x1D57;-1) (strips don't overlap)</text>

  <!-- ============================================================ -->
  <!-- DIVIDER                                                      -->
  <!-- ============================================================ -->
  <line x1="40" y1="226" x2="720" y2="226" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ============================================================ -->
  <!-- SECTION 2: TRUNCATION                                        -->
  <!-- Phantoms form one contiguous block of size 2^t around x     -->
  <!-- Total points in block = 2^t = 8 (7 phantoms + 1 stored key) -->
  <!-- ============================================================ -->

  <!-- section header -->
  <text x="20" y="250" font-weight="bold" font-size="14">Truncation — phantoms in U</text>
  <text x="20" y="265" font-size="12" fill="#555">Points y ∈ Y mapped to x' form one contiguous block of size 2&#x1D57;</text>

  <!-- U axis -->
  <line x1="60" y1="310" x2="700" y2="310" stroke="#333" stroke-width="1.5"/>
  <text x="50" y="314" text-anchor="end" font-size="12" fill="#666">U</text>

  <!-- phantom block background [268, 436] = 2^t wide -->
  <rect x="268" y="299" width="168" height="22" fill="#2a7fff" opacity="0.13" rx="2"/>

  <!-- left collision zone: 3 phantoms closest to x on the left (296, 314, 332) -->
  <rect x="247" y="297" width="78" height="26" fill="#4caf50" opacity="0.28" rx="2" stroke="#4caf50" stroke-width="0.9" stroke-dasharray="3,2"/>

  <!-- right collision zone: 3 phantoms closest to x on the right (388, 406, 424) -->
  <rect x="398" y="297" width="58" height="26" fill="#4caf50" opacity="0.28" rx="2" stroke="#4caf50" stroke-width="0.9" stroke-dasharray="3,2"/>

  <!-- outermost left phantom — outside collision zone (278) -->
  <circle cx="278" cy="310" r="5" fill="#d32f2f"/>

  <!-- left collision zone phantoms (296, 314, 332) -->
  <circle cx="296" cy="310" r="5" fill="#d32f2f"/>
  <circle cx="314" cy="310" r="5" fill="#d32f2f"/>
  <circle cx="332" cy="310" r="5" fill="#d32f2f"/>

  <!-- right collision zone phantoms (388, 406, 424) -->
  <circle cx="388" cy="310" r="5" fill="#d32f2f"/>
  <circle cx="406" cy="310" r="5" fill="#d32f2f"/>
  <circle cx="424" cy="310" r="5" fill="#d32f2f"/>

  <!-- stored key x (blue, larger) — in the gap between the two collision zones -->
  <circle cx="360" cy="310" r="7" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="360" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">x</text>

  <!-- safe-zone annotation: queries containing x are not false positives -->
  <!-- text offset left to avoid overlapping the x label -->
  <text x="408" y="284" text-anchor="middle" font-size="10" fill="#555">queries contain x</text>
  <text x="388" y="296" text-anchor="middle" font-size="10" fill="#555">→ not FP</text>
  <line x1="268" y1="296" x2="352" y2="308" stroke="#555" stroke-width="0.8" opacity="0.5" stroke-dasharray="2,2"/>

  <!-- arrows: representative phantoms map up to x' -->
  <line x1="296" y1="297" x2="369" y2="79" stroke="#d32f2f" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.45"/>
  <line x1="424" y1="297" x2="371" y2="79" stroke="#d32f2f" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.45"/>
  <!-- x also maps to x' -->
  <line x1="360" y1="303" x2="370" y2="79" stroke="#1565c0" stroke-width="1.1" stroke-dasharray="3,3" opacity="0.65"/>

  <!-- 2^t size bracket under phantom block -->
  <line x1="268" y1="330" x2="436" y2="330" stroke="#1565c0" stroke-width="1.4"/>
  <line x1="268" y1="326" x2="268" y2="334" stroke="#1565c0" stroke-width="1.4"/>
  <line x1="436" y1="326" x2="436" y2="334" stroke="#1565c0" stroke-width="1.4"/>
  <text x="352" y="344" text-anchor="middle" font-size="12" fill="#1565c0">2&#x1D57;</text>

  <!-- two collision zone segments — one per green zone -->
  <!-- left segment under left collision zone [247, 325] -->
  <line x1="247" y1="356" x2="325" y2="356" stroke="#388e3c" stroke-width="1.2"/>
  <line x1="247" y1="352" x2="247" y2="360" stroke="#388e3c" stroke-width="1.2"/>
  <line x1="325" y1="352" x2="325" y2="360" stroke="#388e3c" stroke-width="1.2"/>
  <!-- right segment under right collision zone [398, 456] -->
  <line x1="398" y1="356" x2="456" y2="356" stroke="#388e3c" stroke-width="1.2"/>
  <line x1="398" y1="352" x2="398" y2="360" stroke="#388e3c" stroke-width="1.2"/>
  <line x1="456" y1="352" x2="456" y2="360" stroke="#388e3c" stroke-width="1.2"/>
  <!-- combined label -->
  <text x="352" y="378" text-anchor="middle" font-size="13" fill="#388e3c">Collision zone ≈ 2&#x1D57; &#x2212; 1</text>

</svg>
