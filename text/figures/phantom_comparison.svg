<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="sans-serif" font-size="13">

  <!-- ============================================================ -->
  <!-- TITLE                                                        -->
  <!-- ============================================================ -->
  <text x="380" y="22" text-anchor="middle" font-size="15" font-weight="bold">Phantom points and false-positive query ranges (for a single stored key x)</text>

  <!-- ============================================================ -->
  <!-- SHARED: U' AXIS                                              -->
  <!-- ============================================================ -->
  <text x="20" y="53" font-weight="bold" font-size="13">U' (projected universe)</text>
  <line x1="60" y1="72" x2="700" y2="72" stroke="#333" stroke-width="2"/>
  <circle cx="370" cy="72" r="6" fill="#ff9800" stroke="#e65100" stroke-width="1.5"/>
  <text x="370" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">x'</text>
  <text x="455" y="67" font-size="12" fill="#888">h(y) = x' for all phantoms y</text>

  <!-- ============================================================ -->
  <!-- SECTION 1: RANDOM HASH                                       -->
  <!-- Green strip = L starting positions q ending AT phantom p     -->
  <!-- (phantom at RIGHT edge; strip extends L to the left)         -->
  <!-- ============================================================ -->
  <text x="20" y="103" font-weight="bold" font-size="14">Random hash — phantoms in U</text>
  <text x="20" y="119" font-size="12" fill="#555">Points y ∈ Y mapped to x' are scattered across U</text>

  <!-- U axis -->
  <line x1="60" y1="158" x2="700" y2="158" stroke="#333" stroke-width="1.5"/>
  <text x="50" y="162" text-anchor="end" font-size="12" fill="#666">U</text>

  <!-- collision strips: phantom at RIGHT edge, strip extends L to the left -->
  <!-- strip 1: phantom at 130 → strip [60, 130] -->
  <rect x="60"  y="142" width="70" height="32" fill="#4caf50" opacity="0.22" rx="2" stroke="#4caf50" stroke-width="0.8" stroke-dasharray="3,2"/>
  <!-- strip 2: phantom at 245 → strip [175, 245] -->
  <rect x="175" y="142" width="70" height="32" fill="#4caf50" opacity="0.22" rx="2" stroke="#4caf50" stroke-width="0.8" stroke-dasharray="3,2"/>
  <!-- strip 3: phantom at 355 → strip [285, 355] -->
  <rect x="285" y="142" width="70" height="32" fill="#4caf50" opacity="0.22" rx="2" stroke="#4caf50" stroke-width="0.8" stroke-dasharray="3,2"/>
  <!-- strip 4: phantom at 495 → strip [425, 495] -->
  <rect x="425" y="142" width="70" height="32" fill="#4caf50" opacity="0.22" rx="2" stroke="#4caf50" stroke-width="0.8" stroke-dasharray="3,2"/>
  <!-- strip 5: phantom at 615 → strip [545, 615] -->
  <rect x="545" y="142" width="70" height="32" fill="#4caf50" opacity="0.22" rx="2" stroke="#4caf50" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- L size labels centred on each strip -->
  <text x="95"  y="191" text-anchor="middle" font-size="12" fill="#388e3c">L</text>
  <text x="210" y="191" text-anchor="middle" font-size="12" fill="#388e3c">L</text>
  <text x="320" y="191" text-anchor="middle" font-size="12" fill="#388e3c">L</text>
  <text x="460" y="191" text-anchor="middle" font-size="12" fill="#388e3c">L</text>
  <text x="580" y="191" text-anchor="middle" font-size="12" fill="#388e3c">L</text>

  <!-- phantom points (red) — at the RIGHT edge of each strip -->
  <circle cx="130" cy="158" r="5" fill="#d32f2f"/>
  <circle cx="245" cy="158" r="5" fill="#d32f2f"/>
  <circle cx="355" cy="158" r="5" fill="#d32f2f"/>
  <circle cx="495" cy="158" r="5" fill="#d32f2f"/>
  <circle cx="615" cy="158" r="5" fill="#d32f2f"/>

  <!-- stored key x (blue) — in the gap between strip 3 [285,355] and strip 4 [425,495] -->
  <circle cx="405" cy="158" r="7" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="405" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">x</text>

  <!-- arrows: each phantom maps up to x' -->
  <line x1="130" y1="142" x2="368" y2="79" stroke="#d32f2f" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="245" y1="142" x2="369" y2="79" stroke="#d32f2f" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="355" y1="142" x2="370" y2="79" stroke="#d32f2f" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="495" y1="142" x2="371" y2="79" stroke="#d32f2f" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="615" y1="142" x2="372" y2="79" stroke="#d32f2f" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/>
  <!-- x also maps to x' -->
  <line x1="405" y1="151" x2="373" y2="79" stroke="#1565c0" stroke-width="1.1" stroke-dasharray="3,3" opacity="0.7"/>

  <!-- collision zone label -->
  <text x="375" y="210" text-anchor="middle" font-size="13" fill="#388e3c">Collision zone ≈ L × (2&#x1D57;&#x2212;1)  (strips don't overlap)</text>

  <!-- ============================================================ -->
  <!-- DIVIDER                                                      -->
  <!-- ============================================================ -->
  <line x1="40" y1="226" x2="720" y2="226" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ============================================================ -->
  <!-- SECTION 2: TRUNCATION                                        -->
  <!-- All phantoms in one contiguous block of size 2^t with x.    -->
  <!-- LEFT zone:  q ∈ [block_left − L + 1,  x − L]  width = r    -->
  <!--             (queries end inside block before reaching x)     -->
  <!-- RIGHT zone: q ∈ (x, block_right]       width = 2^t−1−r      -->
  <!--             (queries start right of x, still hit block)      -->
  <!-- Total = r + (2^t−1−r) = 2^t−1, independent of L            -->
  <!-- block = [268, 436],  x = 360,  r = 92,  L ≈ 70 (as drawn)  -->
  <!-- LEFT zone:  [268−70+1, 360−70] = [199, 290]                 -->
  <!-- RIGHT zone: [361, 436]                                       -->
  <!-- ============================================================ -->
  <text x="20" y="250" font-weight="bold" font-size="14">Truncation — phantoms in U</text>
  <text x="20" y="265" font-size="12" fill="#555">Points y ∈ Y mapped to x' form one contiguous block of size 2&#x1D57;</text>

  <!-- U axis -->
  <line x1="60" y1="310" x2="700" y2="310" stroke="#333" stroke-width="1.5"/>
  <text x="50" y="314" text-anchor="end" font-size="12" fill="#666">U</text>

  <!-- phantom block background [268, 436] -->
  <rect x="268" y="299" width="168" height="22" fill="#2a7fff" opacity="0.13" rx="2"/>

  <!-- LEFT collision zone [199, 290]: partly outside block, partly inside -->
  <rect x="199" y="297" width="92" height="26" fill="#4caf50" opacity="0.28" rx="2" stroke="#4caf50" stroke-width="0.9" stroke-dasharray="3,2"/>

  <!-- RIGHT collision zone [375, 436]: inside block, right of x -->
  <rect x="375" y="297" width="59" height="26" fill="#4caf50" opacity="0.28" rx="2" stroke="#4caf50" stroke-width="0.9" stroke-dasharray="3,2"/>

  <!-- Safe-zone hint: starting positions [291, 360] → queries always contain x -->
  <rect x="291" y="299" width="69" height="22" fill="#9e9e9e" opacity="0.10" rx="1"/>

  <!-- all phantom dots in block [268, 436] -->
  <circle cx="278" cy="310" r="5" fill="#d32f2f"/>
  <circle cx="296" cy="310" r="5" fill="#d32f2f"/>
  <circle cx="314" cy="310" r="5" fill="#d32f2f"/>
  <circle cx="332" cy="310" r="5" fill="#d32f2f"/>
  <circle cx="388" cy="310" r="5" fill="#d32f2f"/>
  <circle cx="406" cy="310" r="5" fill="#d32f2f"/>
  <circle cx="424" cy="310" r="5" fill="#d32f2f"/>

  <!-- stored key x -->
  <circle cx="360" cy="310" r="7" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="360" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">x</text>

  <!-- safe-zone annotation: q ∈ [291,360] → query contains x → not FP -->
  <text x="530" y="283" text-anchor="middle" font-size="10" fill="#555">q here → query contains x</text>
  <text x="530" y="295" text-anchor="middle" font-size="10" fill="#555">→ not FP</text>
  <line x1="488" y1="290" x2="330" y2="308" stroke="#555" stroke-width="0.8" opacity="0.55" stroke-dasharray="2,2"/>

  <!-- arrows: representative phantoms map up to x' -->
  <line x1="296" y1="297" x2="369" y2="79" stroke="#d32f2f" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.45"/>
  <line x1="424" y1="297" x2="371" y2="79" stroke="#d32f2f" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.45"/>
  <!-- x also maps to x' -->
  <line x1="360" y1="303" x2="370" y2="79" stroke="#1565c0" stroke-width="1.1" stroke-dasharray="3,3" opacity="0.65"/>

  <!-- 2^t size bracket under the full phantom block [268, 436] -->
  <line x1="268" y1="330" x2="436" y2="330" stroke="#1565c0" stroke-width="1.4"/>
  <line x1="268" y1="326" x2="268" y2="334" stroke="#1565c0" stroke-width="1.4"/>
  <line x1="436" y1="326" x2="436" y2="334" stroke="#1565c0" stroke-width="1.4"/>
  <text x="352" y="344" text-anchor="middle" font-size="12" fill="#1565c0">2&#x1D57;</text>

  <!-- collision zone brackets under the two green zones -->
  <!-- left bracket [199, 290] -->
  <line x1="199" y1="356" x2="290" y2="356" stroke="#388e3c" stroke-width="1.2"/>
  <line x1="199" y1="352" x2="199" y2="360" stroke="#388e3c" stroke-width="1.2"/>
  <line x1="290" y1="352" x2="290" y2="360" stroke="#388e3c" stroke-width="1.2"/>
  <!-- right bracket [375, 436] -->
  <line x1="375" y1="356" x2="436" y2="356" stroke="#388e3c" stroke-width="1.2"/>
  <line x1="375" y1="352" x2="375" y2="360" stroke="#388e3c" stroke-width="1.2"/>
  <line x1="436" y1="352" x2="436" y2="360" stroke="#388e3c" stroke-width="1.2"/>

  <!-- combined label -->
  <text x="330" y="378" text-anchor="middle" font-size="13" fill="#388e3c">Collision zone ≈ 2&#x1D57; &#x2212; 1</text>

</svg>
