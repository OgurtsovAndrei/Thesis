<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Arrow for key-space axis -->
    <marker id="arr-axis" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="#374151" stroke="none"/>
    </marker>
    <!-- Arrow for δ annotations (orient=auto: points in line direction) -->
    <marker id="arr-d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#1d4ed8" stroke-width="1.3"/>
    </marker>
  </defs>

  <rect width="700" height="230" fill="white"/>

  <!-- ── minPts label ── -->
  <text x="28" y="24" font-size="14" fill="#374151" font-weight="600">minPts = 5</text>

  <!-- ══════════════════════════════════════════
       δ-windows (drawn first so points sit on top)
       Core window  [220,380]  – blue
       Left border  [120,280]  – amber
       Right border [320,480]  – amber
       ══════════════════════════════════════════ -->

  <!-- Left border window (taller: extends above and below blue) -->
  <rect x="120" y="101" width="160" height="40" rx="4"
        fill="#fef3c7" fill-opacity="0.7"
        stroke="#f59e0b" stroke-dasharray="6,3" stroke-width="1.4"/>

  <!-- Right border window (taller: extends above and below blue) -->
  <rect x="320" y="101" width="160" height="40" rx="4"
        fill="#fef3c7" fill-opacity="0.7"
        stroke="#f59e0b" stroke-dasharray="6,3" stroke-width="1.4"/>

  <!-- Core window (inset vertically so its borders are clearly inside the yellow ones) -->
  <rect x="220" y="108" width="160" height="26" rx="4"
        fill="#bfdbfe" fill-opacity="0.55"
        stroke="#3b82f6" stroke-dasharray="5,3" stroke-width="1.4"/>

  <!-- ── Number line ── -->
  <line x1="55" y1="136" x2="638" y2="136" stroke="#334155" stroke-width="1.6"
        marker-end="url(#arr-axis)"/>
  <text x="648" y="141" font-size="13" fill="#334155" dominant-baseline="middle">keys</text>

  <!-- ══════════════════════════════════════════
       Points
       Left border:  x=200
       Core cluster: x=270,285,300,315,330
       Right border: x=400
       Noise:        x=505,540
       cy=121  (above the line at 136)
       ══════════════════════════════════════════ -->

  <!-- Left border -->
  <circle cx="200" cy="121" r="9" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>

  <!-- Core cluster -->
  <circle cx="270" cy="121" r="9" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="285" cy="121" r="9" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="300" cy="121" r="9" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="315" cy="121" r="9" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="330" cy="121" r="9" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- Right border -->
  <circle cx="400" cy="121" r="9" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>

  <!-- Noise -->
  <circle cx="505" cy="121" r="9" fill="#d1d5db" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="540" cy="121" r="9" fill="#d1d5db" stroke="#6b7280" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════
       Labels above points
       ══════════════════════════════════════════ -->

  <!-- Border left label -->
  <text x="155" y="52" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="700">Border</text>
  <text x="155" y="66" text-anchor="middle" font-size="11" fill="#c2410c">2 pts &lt; minPts</text>
  <line x1="190" y1="70" x2="198" y2="108" stroke="#c2410c" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Core label -->
  <text x="300" y="52" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="700">Core</text>
  <text x="300" y="66" text-anchor="middle" font-size="11" fill="#1d4ed8">5 pts ≥ minPts</text>
  <line x1="300" y1="70" x2="300" y2="104" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Border right label -->
  <text x="445" y="52" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="700">Border</text>
  <text x="445" y="66" text-anchor="middle" font-size="11" fill="#c2410c">2 pts &lt; minPts</text>
  <line x1="413" y1="70" x2="402" y2="108" stroke="#c2410c" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Noise label -->
  <text x="522" y="52" text-anchor="middle" font-size="13" fill="#6b7280" font-weight="700">Noise</text>
  <line x1="522" y1="56" x2="522" y2="108" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ══════════════════════════════════════════
       δ double-headed arrow below axis
       Two lines from centre x=300:
         right: x=300 → x=378  (points right via orient=auto)
         left:  x=300 → x=222  (points left  via orient=auto)
       ══════════════════════════════════════════ -->

  <!-- δ double-headed arrow spanning the full window: 220 → 380 -->
  <!-- right-pointing: from left edge toward right -->
  <line x1="222" y1="163" x2="376" y2="163"
        stroke="#1d4ed8" stroke-width="1.3" marker-end="url(#arr-d)"/>
  <!-- left-pointing: from right edge toward left (orient=auto flips marker) -->
  <line x1="378" y1="163" x2="224" y2="163"
        stroke="#1d4ed8" stroke-width="1.3" marker-end="url(#arr-d)"/>

  <!-- δ label at centre -->
  <text x="300" y="178" text-anchor="middle" font-size="13" fill="#1d4ed8" font-style="italic">δ</text>

  <!-- ── bottom note ── -->
  <text x="350" y="210" text-anchor="middle" font-size="11" fill="#374151">
    Border points: within δ of a core, but not dense enough to be core themselves
  </text>
</svg>
