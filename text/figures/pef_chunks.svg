<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr-axis" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="#334155" stroke="none"/>
    </marker>
    <marker id="arr-guide" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L5,3 L0,6" fill="#94a3b8" stroke="none"/>
    </marker>
  </defs>

  <rect width="1240" height="540" fill="white"/>

  <!-- ════════════════════════════════════════════════════════════════
       TOP PANEL: universe line, 3 superblocks, points, DP chunks
       ════════════════════════════════════════════════════════════════ -->

  <text x="20" y="24" font-size="13" fill="#475569" font-weight="600">
    PEF: keys split into superblocks (6400 keys each) → DP picks chunk boundaries within → per-chunk codec by min-bitsize
  </text>

  <!-- Superblock background shading drawn FIRST so labels render on top -->
  <rect x="62" y="38" width="178" height="200" fill="#ffffff" stroke="none"/>
  <rect x="240" y="38" width="770" height="200" fill="#e2e8f0" stroke="none"/>
  <rect x="1010" y="38" width="178" height="200" fill="#ffffff" stroke="none"/>

  <!-- Tall dashed dividers between superblocks (very visible) -->
  <line x1="240" y1="38" x2="240" y2="238" stroke="#1e293b" stroke-width="2" stroke-dasharray="7,4"/>
  <line x1="1010" y1="38" x2="1010" y2="238" stroke="#1e293b" stroke-width="2" stroke-dasharray="7,4"/>

  <!-- Superblock labels above axis -->
  <text x="151" y="58" text-anchor="middle" font-size="13" fill="#94a3b8" font-weight="600">Superblock 1</text>
  <text x="151" y="76" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-style="italic">6400 keys · skipped</text>

  <text x="625" y="58" text-anchor="middle" font-size="13" fill="#334155" font-weight="600">Superblock 2  (zoomed)</text>
  <text x="625" y="76" text-anchor="middle" font-size="10.5" fill="#64748b">6400 keys → one DP call → 3 chunks shown</text>

  <text x="1099" y="58" text-anchor="middle" font-size="13" fill="#94a3b8" font-weight="600">Superblock 3</text>
  <text x="1099" y="76" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-style="italic">6400 keys · skipped</text>

  <!-- Superblock boundary marks ] [ above axis (small accent) -->
  <text x="232" y="143" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">]</text>
  <text x="248" y="143" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">[</text>
  <text x="1002" y="143" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">]</text>
  <text x="1018" y="143" text-anchor="middle" font-size="20" fill="#1e293b" font-weight="700">[</text>

  <!-- Universe axis -->
  <line x1="62" y1="150" x2="1198" y2="150" stroke="#334155" stroke-width="1.6"
        marker-end="url(#arr-axis)"/>
  <text x="1208" y="155" font-size="12" fill="#334155" dominant-baseline="middle">keys</text>
  <text x="56" y="155" text-anchor="end" font-size="11" fill="#64748b">0</text>

  <!-- ── Points on axis ── -->
  <!-- SB1: skipped — ellipsis only -->
  <text x="151" y="158" text-anchor="middle" font-size="22" fill="#94a3b8" font-weight="700">. . .</text>

  <!-- SB2 chunk A (sparse, 6 keys) -->
  <g fill="#1e40af" stroke="#1e3a8a" stroke-width="1">
    <circle cx="298" cy="150" r="4"/>
    <circle cx="325" cy="150" r="4"/>
    <circle cx="365" cy="150" r="4"/>
    <circle cx="410" cy="150" r="4"/>
    <circle cx="450" cy="150" r="4"/>
    <circle cx="485" cy="150" r="4"/>
  </g>

  <!-- SB2 chunk B (dense cluster, 8 keys) -->
  <g fill="#b45309" stroke="#92400e" stroke-width="1">
    <circle cx="555" cy="150" r="4"/>
    <circle cx="565" cy="150" r="4"/>
    <circle cx="570" cy="150" r="4"/>
    <circle cx="578" cy="150" r="4"/>
    <circle cx="590" cy="150" r="4"/>
    <circle cx="608" cy="150" r="4"/>
    <circle cx="617" cy="150" r="4"/>
    <circle cx="690" cy="150" r="4"/>
  </g>

  <!-- SB2 chunk C (NEW: mid-dense EF, 4 keys — borderline vs bitmap) -->
  <g fill="#1e40af" stroke="#1e3a8a" stroke-width="1">
    <circle cx="720" cy="150" r="4"/>
    <circle cx="743" cy="150" r="4"/>
    <circle cx="776" cy="150" r="4"/>
    <circle cx="805" cy="150" r="4"/>
  </g>

  <!-- SB2 chunk D (consecutive run, 10 keys — compressed for visual density) -->
  <g fill="#15803d" stroke="#14532d" stroke-width="1">
    <circle cx="830" cy="150" r="4"/>
    <circle cx="839" cy="150" r="4"/>
    <circle cx="848" cy="150" r="4"/>
    <circle cx="857" cy="150" r="4"/>
    <circle cx="866" cy="150" r="4"/>
    <circle cx="875" cy="150" r="4"/>
    <circle cx="884" cy="150" r="4"/>
    <circle cx="893" cy="150" r="4"/>
    <circle cx="902" cy="150" r="4"/>
    <circle cx="911" cy="150" r="4"/>
  </g>

  <!-- SB3: skipped — ellipsis only -->
  <text x="1099" y="158" text-anchor="middle" font-size="22" fill="#94a3b8" font-weight="700">. . .</text>

  <!-- ── Chunk brackets below axis (DP partition result) ── -->
  <!-- Chunk A (EF) - blue -->
  <path d="M 290 174 L 290 168 L 493 168 L 493 174"
        fill="none" stroke="#1e40af" stroke-width="2"/>
  <text x="391" y="192" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="700">A · Elias-Fano</text>

  <!-- Chunk B (Bitmap) - amber -->
  <path d="M 548 174 L 548 168 L 697 168 L 697 174"
        fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="622" y="192" text-anchor="middle" font-size="12" fill="#b45309" font-weight="700">B · Bitmap</text>

  <!-- Chunk C (EF mid-dense, NEW) - blue -->
  <path d="M 712 174 L 712 168 L 815 168 L 815 174"
        fill="none" stroke="#1e40af" stroke-width="2"/>
  <text x="763" y="192" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="700">C · EF</text>

  <!-- Chunk D (All-ones, was C) - green -->
  <path d="M 825 174 L 825 168 L 916 168 L 916 174"
        fill="none" stroke="#15803d" stroke-width="2"/>
  <text x="870" y="192" text-anchor="middle" font-size="12" fill="#15803d" font-weight="700">D · All-ones</text>

  <!-- Divider between top and detail panels -->
  <line x1="20" y1="248" x2="1220" y2="248" stroke="#e2e8f0" stroke-width="1"/>
  <text x="20" y="268" font-size="12" fill="#475569" font-weight="600">In-memory layout per chunk:</text>

  <!-- Guide lines connecting chunks to panels (C uses panel A's codec) -->
  <line x1="391" y1="200" x2="216" y2="288" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-guide)"/>
  <line x1="622" y1="200" x2="619" y2="288" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-guide)"/>
  <line x1="763" y1="200" x2="216" y2="288" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,4" opacity="0.6"/>
  <line x1="870" y1="200" x2="1022" y2="288" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-guide)"/>

  <!-- ════════════════════════════════════════════════════════════════
       OVERVIEW PANEL A & C: Elias-Fano chunk
       ════════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="20" y="295" width="393" height="220" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5" rx="6"/>
    <rect x="20" y="295" width="393" height="32" fill="#1e40af" rx="6"/>
    <rect x="20" y="320" width="393" height="7" fill="#1e40af"/>
    <text x="216" y="316" text-anchor="middle" font-size="13" fill="white" font-weight="700">Chunks A &amp; C · Elias-Fano</text>

    <text x="34" y="354" font-size="11.5" fill="#1e40af" font-weight="600">Default codec — sparse to mid-dense chunks.</text>

    <text x="34" y="380" font-size="11" fill="#334155" font-weight="600">Stores per chunk:</text>
    <text x="44" y="398" font-size="10.5" fill="#475569">• low bits — ℓ = ⌊log₂(U/n)⌋ packed bits per key</text>
    <text x="44" y="414" font-size="10.5" fill="#475569">• high bits — unary buckets (1 header per bucket,</text>
    <text x="56" y="429" font-size="10.5" fill="#475569">0 per key) appended to shared rsdic</text>

    <text x="34" y="453" font-size="11" fill="#334155" font-weight="600">Cost:</text>
    <text x="44" y="470" font-size="10.5" fill="#475569">payload  ≈ (ℓ + 2) bits/key  (wins when 1/d &gt; ~4)</text>
    <text x="44" y="485" font-size="10.5" fill="#475569">metadata = 16 B chunk + 24 B efMeta = 40 B/chunk</text>

    <text x="34" y="506" font-size="10.5" fill="#1e40af" font-weight="700">Figure: A → 44 b · C → 18 b (beats bitmap by 1)</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════════
       OVERVIEW PANEL B: Bitmap chunk
       ════════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="423" y="295" width="393" height="220" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" rx="6"/>
    <rect x="423" y="295" width="393" height="32" fill="#b45309" rx="6"/>
    <rect x="423" y="320" width="393" height="7" fill="#b45309"/>
    <text x="619" y="316" text-anchor="middle" font-size="13" fill="white" font-weight="700">Chunk B · Bitmap</text>

    <text x="437" y="354" font-size="11.5" fill="#b45309" font-weight="600">Dense clusters where bitmap beats EF.</text>

    <text x="437" y="380" font-size="11" fill="#334155" font-weight="600">Stores per chunk:</text>
    <text x="447" y="398" font-size="10.5" fill="#475569">• flat bit-vector — (lastRel + 1) bits</text>
    <text x="459" y="413" font-size="10.5" fill="#475569">1 = key present, 0 = absent</text>
    <text x="447" y="429" font-size="10.5" fill="#475569">• appended to shared rsdic (no low-bits buffer)</text>

    <text x="437" y="453" font-size="11" fill="#334155" font-weight="600">Cost:</text>
    <text x="447" y="470" font-size="10.5" fill="#475569">payload  = 1/d bits/key  (wins when d ≳ 1/4)</text>
    <text x="447" y="485" font-size="10.5" fill="#475569">metadata = 16 B chunk + 8 B bmMeta = 24 B/chunk</text>

    <text x="437" y="506" font-size="10.5" fill="#b45309" font-weight="700">Figure: 8 keys / 15 slots → 15 bits</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════════
       OVERVIEW PANEL D: All-ones chunk
       ════════════════════════════════════════════════════════════════ -->
  <g>
    <rect x="826" y="295" width="393" height="220" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" rx="6"/>
    <rect x="826" y="295" width="393" height="32" fill="#15803d" rx="6"/>
    <rect x="826" y="320" width="393" height="7" fill="#15803d"/>
    <text x="1022" y="316" text-anchor="middle" font-size="13" fill="white" font-weight="700">Chunk D · All-ones</text>

    <text x="840" y="354" font-size="11.5" fill="#15803d" font-weight="600">Contiguous run — degenerate case.</text>

    <text x="840" y="380" font-size="11" fill="#334155" font-weight="600">Stores per chunk:</text>
    <text x="850" y="398" font-size="10.5" fill="#475569">• nothing — neither metadata nor payload</text>
    <text x="850" y="414" font-size="10.5" fill="#475569">• keys reconstructed from (base, last, n)</text>
    <text x="850" y="429" font-size="10.5" fill="#475569">  via  key[i] = base + i</text>

    <text x="840" y="453" font-size="11" fill="#334155" font-weight="600">Cost:</text>
    <text x="850" y="470" font-size="10.5" fill="#475569">payload  = 0 bits/key  (trigger: lastRel == n − 1)</text>
    <text x="850" y="485" font-size="10.5" fill="#475569">metadata = 16 B chunk only = 16 B/chunk</text>

    <text x="840" y="506" font-size="10.5" fill="#15803d" font-weight="700">Figure: 10 consecutive keys → 0 bits payload</text>
  </g>
</svg>
